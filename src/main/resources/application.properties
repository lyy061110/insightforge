# ========================================
# InsightForge 应用程序配置文件
# ========================================

# ----------------------------------------
# 服务器配置
# ----------------------------------------
# 服务器端口号，默认为8080，此处修改为8088避免与其他服务冲突
server.port=8088
# 应用程序名称，用于服务标识和日志记录
spring.application.name=insightforge

# ----------------------------------------
# 数据库配置 (H2 嵌入式数据库)
# ----------------------------------------
# H2数据库连接URL
# jdbc:h2:file:./data/insightforge - 数据库文件存储在 ./data/insightforge 目录
# DB_CLOSE_DELAY=-1 - 数据库在最后一个连接关闭后保持打开状态
# AUTO_RECONNECT=TRUE - 启用自动重连功能
spring.datasource.url=jdbc:h2:file:./data/insightforge;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
# H2数据库驱动类名
spring.datasource.driver-class-name=org.h2.Driver
# 数据库用户名，H2默认为sa
spring.datasource.username=sa
# 数据库密码，H2默认为空
spring.datasource.password=

# ----------------------------------------
# H2 数据库控制台配置
# ----------------------------------------
# 启用H2数据库Web控制台，便于开发调试时查看数据库内容
spring.h2.console.enabled=true
# H2控制台访问路径，可通过 http://localhost:8088/h2-console 访问
spring.h2.console.path=/h2-console

# ----------------------------------------
# 数据库初始化配置
# ----------------------------------------
# SQL初始化模式：always表示每次启动都执行初始化脚本
spring.sql.init.mode=always
# 数据库表结构初始化脚本位置
spring.sql.init.schema-locations=classpath:schema.sql
# 数据库初始数据脚本位置
spring.sql.init.data-locations=classpath:data.sql

# ----------------------------------------
# MyBatis 配置
# ----------------------------------------
# MyBatis Mapper XML文件位置，支持通配符匹配
mybatis.mapper-locations=classpath:mybatis/*.xml
# 实体类别名包路径，简化XML中的类名引用
mybatis.type-aliases-package=com.insightforge.entity
# 开启下划线到驼峰命名自动映射，如 user_name -> userName
mybatis.configuration.map-underscore-to-camel-case=true

# ----------------------------------------
# Thymeleaf 模板引擎配置
# ----------------------------------------
# 模板文件前缀路径，模板文件存放位置
spring.thymeleaf.prefix=classpath:/templates/
# 模板文件后缀，自动为视图名添加.html扩展名
spring.thymeleaf.suffix=.html
# 禁用模板缓存，开发环境下建议关闭以支持热更新
spring.thymeleaf.cache=false
# 启用请求上下文表达式对象，支持在模板中访问请求相关信息
spring.thymeleaf.expression-objects-request-context-enabled=true

# ----------------------------------------
# 国际化消息配置
# ----------------------------------------
# 消息资源文件基础名称，用于多语言支持
spring.messages.basename=messages
# 消息文件编码格式
spring.messages.encoding=UTF-8

# ----------------------------------------
# 开发工具配置
# ----------------------------------------
# 启用Spring Boot DevTools自动重启功能，代码修改后自动重启应用
spring.devtools.restart.enabled=true

# ----------------------------------------
# 静态资源配置
# ----------------------------------------
# 静态资源位置配置
# classpath:/static/ - 项目内置静态资源目录
# file:uploads/ - 外部上传文件目录，用于存储用户上传的文件
spring.web.resources.static-locations=classpath:/static/,file:uploads/
# 静态资源缓存时间（秒），0表示不缓存，开发环境建议关闭
spring.web.resources.cache-period=0