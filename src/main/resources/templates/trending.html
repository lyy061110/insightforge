<!--
  ============================================================
  页面名称：热门文章页面 (trending.html)
  页面功能：展示热门文章排行榜，按点赞数和评论数排序
  主要内容：
    - 热门文章列表：展示按热度排序的文章，包含排名徽章
    - 文章信息卡片：显示文章标题、作者、点赞数、评论数、发布时间
    - 分类徽章：显示文章所属分类
  使用技术：Thymeleaf模板引擎 + Bootstrap 5框架
  ============================================================
-->
<!DOCTYPE html>
<!-- HTML文档声明，设置语言为中文，引入Thymeleaf命名空间 -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- 字符编码设置 -->
  <meta charset="UTF-8">
  <!-- 视口设置，确保移动端响应式布局 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 页面标题 -->
  <title th:text="#{trending.title}">热门文章 - InsightForge</title>
  <!-- 引入Bootstrap 5 CSS框架 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入Bootstrap Icons图标库 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- ==================== CSS样式定义 ==================== -->
  <style>
    /* ---------- CSS变量定义：全局颜色主题 ---------- */
    :root {
      --primary-dark: #1a2a4a;    /* 主色调深色 */
      --primary: #1e3a6e;         /* 主色调 */
      --primary-light: #2c5aa0;   /* 主色调浅色 */
      --accent: #4a8fe7;          /* 强调色 */
      --bg-light: #f5f7fa;        /* 浅色背景 */
      --white: #ffffff;           /* 白色 */
      --text-dark: #1a1a2e;       /* 深色文字 */
      --text-muted: #6c757d;      /* 灰色文字 */
      --border: #dee2e6;          /* 边框颜色 */
    }

    /* ---------- 页面主体样式 ---------- */
    body {
      background-color: var(--bg-light);  /* 浅色背景 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-dark);            /* 深色文字 */
      min-height: 100vh;                  /* 最小高度为视口高度 */
      display: flex;                      /* 弹性布局 */
      flex-direction: column;             /* 垂直方向排列 */
    }

    /* ---------- 导航栏样式 ---------- */
    .navbar-custom {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));  /* 渐变背景 */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);                                 /* 阴影效果 */
    }

    /* 导航栏品牌标识样式 */
    .navbar-custom .navbar-brand {
      font-weight: 700;          /* 加粗字体 */
      font-size: 1.5rem;         /* 字体大小 */
      color: var(--white) !important;  /* 白色文字 */
      letter-spacing: 0.5px;     /* 字间距 */
    }

    /* 导航栏品牌图标样式 */
    .navbar-custom .navbar-brand i {
      color: var(--accent);      /* 强调色 */
      margin-right: 6px;         /* 右侧间距 */
    }

    /* 导航栏链接样式 */
    .navbar-custom .nav-link {
      color: rgba(255, 255, 255, 0.85) !important;  /* 半透明白色 */
      font-weight: 500;                             /* 中等字重 */
      transition: color 0.2s;                       /* 颜色过渡动画 */
      padding: 0.5rem 1rem;                         /* 内边距 */
    }

    /* 导航栏链接悬停样式 */
    .navbar-custom .nav-link:hover {
      color: var(--white) !important;  /* 悬停时变为纯白色 */
    }

    /* 导航栏链接图标样式 */
    .navbar-custom .nav-link i {
      margin-right: 4px;  /* 图标右侧间距 */
    }

    /* 导航栏折叠按钮样式 */
    .navbar-custom .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.5);  /* 半透明白色边框 */
    }

    /* 导航栏折叠按钮图标样式 */
    .navbar-custom .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255,255,255,0.8)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ---------- 主内容区域样式 ---------- */
    .main-content {
      flex: 1;                    /* 占据剩余空间 */
      padding-top: 1.5rem;        /* 顶部内边距 */
      padding-bottom: 3rem;       /* 底部内边距 */
    }

    /* ---------- 页脚样式 ---------- */
    .footer-custom {
      background: var(--primary-dark);           /* 深色背景 */
      color: rgba(255, 255, 255, 0.7);           /* 半透明白色文字 */
      padding: 1rem 0;                           /* 内边距 */
      text-align: center;                        /* 居中对齐 */
      font-size: 0.875rem;                       /* 字体大小 */
      margin-top: auto;                          /* 自动顶部外边距 */
    }

    /* ---------- 页面标题样式 ---------- */
    .page-header {
      display: flex;              /* 弹性布局 */
      align-items: center;        /* 垂直居中 */
      gap: 0.75rem;               /* 间距 */
      margin-bottom: 1.5rem;      /* 底部外边距 */
    }

    /* 页面标题图标样式 */
    .page-header i {
      font-size: 1.8rem;          /* 大图标 */
      color: #e74c3c;             /* 红色，标识热门 */
    }

    /* 页面标题文字样式 */
    .page-header h4 {
      font-weight: 700;           /* 加粗 */
      color: var(--primary-dark); /* 深主色调 */
      margin: 0;                  /* 无外边距 */
    }

    /* ---------- 热门文章卡片样式 ---------- */
    .trending-card {
      background: var(--white);                   /* 白色背景 */
      border: 1px solid var(--border);            /* 边框 */
      border-radius: 8px;                         /* 圆角 */
      padding: 1.25rem;                           /* 内边距 */
      margin-bottom: 1rem;                        /* 底部外边距 */
      display: flex;                              /* 弹性布局 */
      align-items: flex-start;                    /* 顶部对齐 */
      gap: 1rem;                                  /* 间距 */
      transition: box-shadow 0.2s, transform 0.2s; /* 过渡动画 */
    }

    /* 热门文章卡片悬停效果 */
    .trending-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);  /* 悬停阴影 */
      transform: translateY(-2px);                /* 悬停上移 */
    }

    /* ---------- 热门排名徽章样式 ---------- */
    .trending-rank {
      width: 36px;                /* 宽度 */
      height: 36px;               /* 高度 */
      background: var(--primary); /* 主色调背景 */
      color: var(--white);        /* 白色文字 */
      border-radius: 50%;         /* 圆形 */
      display: flex;              /* 弹性布局 */
      align-items: center;        /* 垂直居中 */
      justify-content: center;    /* 水平居中 */
      font-weight: 700;           /* 加粗 */
      font-size: 1rem;            /* 字体大小 */
      flex-shrink: 0;             /* 不收缩 */
    }

    /* 第一名热门项排名徽章：红色 */
    .trending-card:nth-child(1) .trending-rank {
      background: #e74c3c;
    }

    /* 第二名热门项排名徽章：橙色 */
    .trending-card:nth-child(2) .trending-rank {
      background: #e67e22;
    }

    /* 第三名热门项排名徽章：黄色 */
    .trending-card:nth-child(3) .trending-rank {
      background: #f1c40f;
      color: #333;
    }

    /* ---------- 热门文章内容样式 ---------- */
    .trending-content {
      flex: 1;                    /* 占据剩余空间 */
    }

    /* 热门文章标题样式 */
    .trending-content .post-title {
      font-size: 1.15rem;         /* 字体大小 */
      font-weight: 600;           /* 半粗体 */
      color: var(--primary);      /* 主色调 */
      text-decoration: none;      /* 无下划线 */
      display: block;             /* 块级显示 */
      margin-bottom: 0.5rem;      /* 底部外边距 */
    }

    /* 热门文章标题悬停样式 */
    .trending-content .post-title:hover {
      color: var(--primary-light); /* 浅主色调 */
    }

    /* 热门文章元信息样式 */
    .trending-content .post-meta {
      font-size: 0.85rem;         /* 字体大小 */
      color: var(--text-muted);   /* 灰色文字 */
      display: flex;              /* 弹性布局 */
      flex-wrap: wrap;            /* 换行 */
      align-items: center;        /* 垂直居中 */
      gap: 0.5rem;                /* 间距 */
    }

    /* ---------- 分类徽章样式 ---------- */
    .category-badge {
      background: var(--primary-light);  /* 浅主色调背景 */
      color: var(--white);               /* 白色文字 */
      font-size: 0.75rem;                /* 字体大小 */
      font-weight: 500;                  /* 中等字重 */
      padding: 2px 10px;                 /* 内边距 */
      border-radius: 12px;               /* 圆角 */
      text-decoration: none;             /* 无下划线 */
    }

    /* 分类徽章悬停样式 */
    .category-badge:hover {
      background: var(--accent);   /* 强调色背景 */
      color: var(--white);         /* 白色文字 */
    }

    /* ---------- 空状态提示样式 ---------- */
    .empty-state {
      text-align: center;         /* 居中对齐 */
      padding: 3rem 0;            /* 内边距 */
      color: var(--text-muted);   /* 灰色文字 */
    }

    .empty-state i {
      font-size: 3rem;            /* 大图标 */
      margin-bottom: 1rem;        /* 底部外边距 */
    }

    /* ---------- 全局链接样式 ---------- */
    a {
      color: var(--primary);
    }

    a:hover {
      color: var(--primary-light);
    }
  </style>
</head>
<body>

<!-- ==================== 引入导航栏片段 ==================== -->
<!-- th:replace：替换为layout模板中的navbar片段 -->
<th:block th:replace="~{layout :: navbar}"></th:block>

<!-- ==================== 主内容区域 ==================== -->
<div class="main-content">
  <div class="container">
    <!-- ---------- 页面标题 ---------- -->
    <div class="page-header">
      <i class="bi bi-fire"></i>
      <h4 th:text="#{trending.header}">热门文章</h4>
    </div>

    <!-- ---------- 热门文章列表 ---------- -->
    <!-- th:if：当热门文章不为空时显示列表 -->
    <th:block th:if="${posts != null and !posts.isEmpty()}">
      <!-- th:each：遍历热门文章列表，iterStat为循环状态变量 -->
      <div class="trending-card" th:each="post, iterStat : ${posts}">
        <!-- 热门排名徽章 -->
        <!-- iterStat.index：获取当前索引（从0开始），+1转换为排名 -->
        <div class="trending-rank" th:text="${iterStat.index + 1}">1</div>
        <!-- 热门文章内容 -->
        <div class="trending-content">
          <!-- 文章标题链接 -->
          <!-- th:href：生成文章详情页链接 -->
          <a class="post-title" th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}">文章标题</a>
          <!-- 文章元信息 -->
          <div class="post-meta">
            <!-- 作者信息 -->
            <span><i class="bi bi-person-circle"></i> <span th:text="${post.authorName} ?: 'Anonymous'">作者</span></span>
            <span class="text-muted">|</span>
            <!-- 点赞数 -->
            <span><i class="bi bi-hand-thumbs-up"></i> <span th:text="${post.likeCount}">0</span></span>
            <!-- 评论数 -->
            <span><i class="bi bi-chat-dots"></i> <span th:text="${post.commentCount}">0</span></span>
            <span class="text-muted">|</span>
            <!-- 发布时间 -->
            <!-- th:if：时间不为空时显示 -->
            <!-- #temporals.format：日期格式化 -->
            <span th:if="${post.createdAt != null}"><i class="bi bi-clock"></i> <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">时间</span></span>
            <!-- 分类徽章 -->
            <!-- th:if：分类不为空时显示 -->
            <a th:href="@{/category/{name}(name=${post.category})}" class="category-badge" th:text="${post.category}" th:if="${post.category != null}">分类</a>
          </div>
        </div>
      </div>
    </th:block>

    <!-- ---------- 空状态提示 ---------- -->
    <!-- th:if：当热门文章为空时显示空状态提示 -->
    <th:block th:if="${posts == null or posts.isEmpty()}">
      <div class="empty-state">
        <i class="bi bi-fire d-block"></i>
        <p class="fs-5" th:text="#{trending.noPosts}">暂无热门文章</p>
        <!-- 引导用户浏览文章 -->
        <a th:href="@{/}" class="btn btn-primary-custom mt-2">
          <i class="bi bi-house-door"></i> <span th:text="#{home.publishPost}">浏览文章</span>
        </a>
      </div>
    </th:block>
  </div>
</div>

<!-- ==================== 引入页脚片段 ==================== -->
<!-- th:replace：替换为layout模板中的footer片段 -->
<th:block th:replace="~{layout :: footer}"></th:block>

<!-- 引入Bootstrap 5 JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
