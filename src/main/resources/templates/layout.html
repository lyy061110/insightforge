<!--
  ============================================================
  页面名称：布局模板 (layout.html)
  页面功能：定义全局公共组件片段，包括导航栏和页脚
  主要内容：
    - navbar片段：顶部导航栏，包含品牌标识、导航链接、用户下拉菜单
    - footer片段：底部页脚，显示版权信息
  使用技术：Thymeleaf模板引擎 + Bootstrap 5框架
  特殊说明：此文件定义可复用的片段，其他页面通过th:replace引用
  ============================================================
-->
<!DOCTYPE html>
<!-- HTML文档声明，引入Thymeleaf命名空间 -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- 字符编码设置 -->
  <meta charset="UTF-8">
  <!-- 视口设置，确保移动端响应式布局 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- th:text：动态设置页面标题，?: 为Elvis运算符提供默认值 -->
  <title th:text="${pageTitle} ?: 'InsightForge'">InsightForge</title>
  <!-- 引入Bootstrap 5 CSS框架 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入Bootstrap Icons图标库 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- ==================== CSS样式定义 ==================== -->
  <style>
    /* ---------- CSS变量定义：全局颜色主题 ---------- */
    :root {
      --primary-dark: #1a2a4a;    /* 主色调深色 */
      --primary: #1e3a6e;         /* 主色调 */
      --primary-light: #2c5aa0;   /* 主色调浅色 */
      --accent: #4a8fe7;          /* 强调色 */
      --bg-light: #f5f7fa;        /* 浅色背景 */
      --white: #ffffff;           /* 白色 */
      --text-dark: #1a1a2e;       /* 深色文字 */
      --text-muted: #6c757d;      /* 灰色文字 */
      --border: #dee2e6;          /* 边框颜色 */
      --danger: #dc3545;          /* 危险色（红色） */
      --warning: #ffc107;         /* 警告色（黄色） */
      --success: #198754;         /* 成功色（绿色） */
      --info: #0dcaf0;            /* 信息色（蓝色） */
    }

    /* ---------- 页面主体样式 ---------- */
    body {
      background-color: var(--bg-light);  /* 浅色背景 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-dark);            /* 深色文字 */
      min-height: 100vh;                  /* 最小高度为视口高度 */
      display: flex;                      /* 弹性布局 */
      flex-direction: column;             /* 垂直方向排列 */
    }

    /* ---------- 导航栏样式 ---------- */
    .navbar-custom {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));  /* 渐变背景 */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);                                 /* 阴影效果 */
    }

    /* 导航栏品牌标识样式 */
    .navbar-custom .navbar-brand {
      font-weight: 700;          /* 加粗字体 */
      font-size: 1.5rem;         /* 字体大小 */
      color: var(--white) !important;  /* 白色文字 */
      letter-spacing: 0.5px;     /* 字间距 */
    }

    /* 导航栏品牌图标样式 */
    .navbar-custom .navbar-brand i {
      color: var(--accent);      /* 强调色 */
      margin-right: 6px;         /* 右侧间距 */
    }

    /* 导航栏链接样式 */
    .navbar-custom .nav-link {
      color: rgba(255, 255, 255, 0.85) !important;  /* 半透明白色 */
      font-weight: 500;                             /* 中等字重 */
      transition: color 0.2s;                       /* 颜色过渡动画 */
      padding: 0.5rem 1rem;                         /* 内边距 */
    }

    /* 导航栏链接悬停和激活样式 */
    .navbar-custom .nav-link:hover,
    .navbar-custom .nav-link.active {
      color: var(--white) !important;  /* 悬停/激活时变为纯白色 */
    }

    /* 导航栏链接图标样式 */
    .navbar-custom .nav-link i {
      margin-right: 4px;  /* 图标右侧间距 */
    }

    /* 导航栏折叠按钮样式 */
    .navbar-custom .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.5);  /* 半透明白色边框 */
    }

    /* 导航栏折叠按钮图标样式 */
    .navbar-custom .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255,255,255,0.8)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ---------- 主内容区域样式 ---------- */
    .main-content {
      flex: 1;                    /* 占据剩余空间 */
      padding-top: 1.5rem;        /* 顶部内边距 */
      padding-bottom: 3rem;       /* 底部内边距 */
    }

    /* ---------- 页脚样式 ---------- */
    .footer-custom {
      background: var(--primary-dark);           /* 深色背景 */
      color: rgba(255, 255, 255, 0.7);           /* 半透明白色文字 */
      padding: 1rem 0;                           /* 内边距 */
      text-align: center;                        /* 居中对齐 */
      font-size: 0.875rem;                       /* 字体大小 */
      margin-top: auto;                          /* 自动顶部外边距 */
    }

    /* ---------- 文章卡片样式 ---------- */
    .post-card {
      background: var(--white);                   /* 白色背景 */
      border: 1px solid var(--border);            /* 边框 */
      border-radius: 8px;                         /* 圆角 */
      padding: 1.25rem;                           /* 内边距 */
      margin-bottom: 1rem;                        /* 底部外边距 */
      transition: box-shadow 0.2s, transform 0.2s; /* 过渡动画 */
    }

    /* 文章卡片悬停效果 */
    .post-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);  /* 悬停阴影 */
      transform: translateY(-2px);                /* 悬停上移 */
    }

    /* 文章卡片标题样式 */
    .post-card .post-title {
      font-size: 1.2rem;          /* 字体大小 */
      font-weight: 600;           /* 半粗体 */
      color: var(--primary);      /* 主色调 */
      text-decoration: none;      /* 无下划线 */
    }

    /* 文章卡片标题悬停样式 */
    .post-card .post-title:hover {
      color: var(--primary-light);  /* 悬停时变为浅主色调 */
    }

    /* 文章卡片元信息样式 */
    .post-card .post-meta {
      font-size: 0.85rem;         /* 字体大小 */
      color: var(--text-muted);   /* 灰色文字 */
    }

    /* 文章卡片统计图标样式 */
    .post-card .post-stats i {
      margin-right: 2px;          /* 图标右侧间距 */
    }

    /* ---------- 分类徽章样式 ---------- */
    .category-badge {
      background: var(--primary-light);  /* 浅主色调背景 */
      color: var(--white);               /* 白色文字 */
      font-size: 0.75rem;                /* 字体大小 */
      font-weight: 500;                  /* 中等字重 */
      padding: 2px 10px;                 /* 内边距 */
      border-radius: 12px;               /* 圆角 */
      text-decoration: none;             /* 无下划线 */
    }

    /* 分类徽章悬停样式 */
    .category-badge:hover {
      background: var(--accent);   /* 悬停时强调色背景 */
      color: var(--white);         /* 白色文字 */
    }

    /* ---------- 侧边栏卡片样式 ---------- */
    .sidebar-card {
      background: var(--white);           /* 白色背景 */
      border: 1px solid var(--border);    /* 边框 */
      border-radius: 8px;                 /* 圆角 */
      padding: 1.25rem;                   /* 内边距 */
      margin-bottom: 1.25rem;             /* 底部外边距 */
    }

    /* 侧边栏卡片标题样式 */
    .sidebar-card .card-title {
      font-weight: 700;                   /* 加粗 */
      color: var(--primary-dark);         /* 深主色调 */
      margin-bottom: 1rem;                /* 底部外边距 */
      padding-bottom: 0.5rem;             /* 底部内边距 */
      border-bottom: 2px solid var(--accent);  /* 底部边框 */
    }

    /* ---------- 热门文章列表项样式 ---------- */
    .trending-item {
      display: flex;              /* 弹性布局 */
      align-items: center;        /* 垂直居中 */
      padding: 0.5rem 0;          /* 内边距 */
      border-bottom: 1px solid #f0f0f0;  /* 底部边框 */
    }

    /* 最后一个热门项去除底部边框 */
    .trending-item:last-child {
      border-bottom: none;
    }

    /* 热门排名徽章样式 */
    .trending-rank {
      width: 28px;                /* 宽度 */
      height: 28px;               /* 高度 */
      background: var(--primary); /* 主色调背景 */
      color: var(--white);        /* 白色文字 */
      border-radius: 50%;         /* 圆形 */
      display: flex;              /* 弹性布局 */
      align-items: center;        /* 垂直居中 */
      justify-content: center;    /* 水平居中 */
      font-weight: 700;           /* 加粗 */
      font-size: 0.85rem;         /* 字体大小 */
      margin-right: 0.75rem;      /* 右侧外边距 */
      flex-shrink: 0;             /* 不收缩 */
    }

    /* 第一名热门项排名徽章：红色 */
    .trending-item:nth-child(1) .trending-rank {
      background: #e74c3c;
    }

    /* 第二名热门项排名徽章：橙色 */
    .trending-item:nth-child(2) .trending-rank {
      background: #e67e22;
    }

    /* 第三名热门项排名徽章：黄色 */
    .trending-item:nth-child(3) .trending-rank {
      background: #f1c40f;
      color: #333;
    }

    /* ---------- 自定义按钮样式 ---------- */
    /* 主色调按钮 */
    .btn-primary-custom {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    .btn-primary-custom:hover {
      background: var(--primary-light);
      border-color: var(--primary-light);
      color: var(--white);
    }

    /* 主色调边框按钮 */
    .btn-outline-primary-custom {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-outline-primary-custom:hover {
      background: var(--primary);
      color: var(--white);
    }

    /* ---------- 搜索框样式 ---------- */
    .search-box {
      max-width: 500px;  /* 最大宽度 */
    }

    .search-box .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(74, 143, 231, 0.25);
    }

    /* ---------- 认证卡片样式（登录/注册页面） ---------- */
    .auth-card {
      background: var(--white);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
    }

    /* 认证卡片标题样式 */
    .auth-card .auth-title {
      font-weight: 700;
      color: var(--primary-dark);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* ---------- 空状态提示样式 ---------- */
    .empty-state {
      text-align: center;         /* 居中对齐 */
      padding: 3rem 0;            /* 内边距 */
      color: var(--text-muted);   /* 灰色文字 */
    }

    .empty-state i {
      font-size: 3rem;            /* 大图标 */
      margin-bottom: 1rem;        /* 底部外边距 */
    }

    /* ---------- 已标记文章提示横幅样式 ---------- */
    .flagged-banner {
      background: #fff3cd;        /* 浅黄色背景 */
      border: 1px solid #ffc107;  /* 黄色边框 */
      border-radius: 8px;         /* 圆角 */
      padding: 0.75rem 1rem;      /* 内边距 */
      color: #856404;             /* 深黄色文字 */
      font-weight: 500;           /* 中等字重 */
      margin-bottom: 1rem;        /* 底部外边距 */
    }

    .flagged-banner i {
      margin-right: 0.5rem;       /* 图标右侧间距 */
    }

    /* ---------- 评论项样式 ---------- */
    .comment-item {
      border-bottom: 1px solid #f0f0f0;  /* 底部边框 */
      padding: 0.75rem 0;               /* 内边距 */
    }

    .comment-item:last-child {
      border-bottom: none;              /* 最后一个去除边框 */
    }

    /* ---------- 标签页内容包装器样式 ---------- */
    .tab-content-wrapper {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 1.25rem;
    }

    /* ---------- 标签页导航样式 ---------- */
    .nav-tabs .nav-link {
      color: var(--text-dark);
      font-weight: 500;
    }

    .nav-tabs .nav-link.active {
      color: var(--primary);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }

    /* ---------- 自定义表格样式 ---------- */
    .table-custom th {
      background: var(--primary-dark);  /* 表头深色背景 */
      color: var(--white);              /* 白色文字 */
      font-weight: 600;                 /* 半粗体 */
    }

    .table-custom td {
      vertical-align: middle;           /* 垂直居中 */
    }

    /* ---------- 严重度徽章样式 ---------- */
    .severity-badge {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* 高严重度：红色 */
    .severity-high {
      background: #f8d7da;
      color: #842029;
    }

    /* 中严重度：黄色 */
    .severity-medium {
      background: #fff3cd;
      color: #856404;
    }

    /* 低严重度：绿色 */
    .severity-low {
      background: #d1e7dd;
      color: #0f5132;
    }

    /* ---------- 状态徽章样式 ---------- */
    /* 已解决状态 */
    .status-badge-resolved {
      background: #d1e7dd;
      color: #0f5132;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* 待处理状态 */
    .status-badge-pending {
      background: #fff3cd;
      color: #856404;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* 已忽略状态 */
    .status-badge-dismissed {
      background: #e2e3e5;
      color: #41464b;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* ---------- 全局链接样式 ---------- */
    a {
      color: var(--primary);
    }

    a:hover {
      color: var(--primary-light);
    }

    /* ---------- 表单控件聚焦样式 ---------- */
    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(74, 143, 231, 0.25);
    }

    /* ---------- 用户头像圆形样式 ---------- */
    .avatar-circle {
      display: inline-flex;       /* 行内弹性布局 */
      align-items: center;        /* 垂直居中 */
      justify-content: center;    /* 水平居中 */
      width: 34px;                /* 宽度 */
      height: 34px;               /* 高度 */
      border-radius: 50%;         /* 圆形 */
      background: var(--accent);  /* 强调色背景 */
      color: var(--white);        /* 白色文字 */
      font-weight: 700;           /* 加粗 */
      font-size: 1rem;            /* 字体大小 */
      text-transform: uppercase;  /* 大写字母 */
      flex-shrink: 0;             /* 不收缩 */
    }

    /* 下拉菜单中的头像样式 */
    .nav-link.dropdown-toggle .avatar-circle {
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
    }

    /* ---------- 下拉菜单样式 ---------- */
    .dropdown-menu-end {
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      padding: 0.5rem 0;
    }

    /* 下拉菜单项样式 */
    .dropdown-menu-end .dropdown-item {
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      transition: background 0.15s;
    }

    .dropdown-menu-end .dropdown-item i {
      margin-right: 0.5rem;
      width: 18px;
      text-align: center;
    }

    .dropdown-menu-end .dropdown-item:hover {
      background: var(--bg-light);
    }

    /* 下拉菜单标题样式 */
    .dropdown-menu-end .dropdown-header {
      font-weight: 600;
      color: var(--primary-dark);
      font-size: 0.85rem;
      padding: 0.5rem 1.25rem;
    }
  </style>
</head>
<body>

<!-- ==================== 导航栏片段定义 ==================== -->
<!-- th:fragment：定义名为navbar的可复用片段 -->
<th:block th:fragment="navbar">
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <!-- 品牌标识：点击返回首页 -->
      <a class="navbar-brand" th:href="@{/}">
        <i class="bi bi-lightbulb-fill"></i>InsightForge
      </a>
      <!-- 移动端折叠按钮 -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- 导航菜单内容 -->
      <!-- th:with：定义局部变量currentUri，用于判断当前页面 -->
      <div class="collapse navbar-collapse" id="navbarNav" th:with="currentUri=${currentUri}">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <!-- 首页导航链接 -->
          <!-- th:classappend：动态添加active类，当currentUri为'/'时激活 -->
          <li class="nav-item">
            <a class="nav-link" th:classappend="${currentUri == '/' ? 'active' : ''}" th:href="@{/}"><i class="bi bi-house-door"></i> <span th:text="#{nav.home}">首页</span></a>
          </li>
          <!-- 热门导航链接 -->
          <!-- #strings.startsWith：判断URL是否以指定路径开头 -->
          <li class="nav-item">
            <a class="nav-link" th:classappend="${#strings.startsWith(currentUri, '/trending') ? 'active' : ''}" th:href="@{/trending}"><i class="bi bi-fire"></i> <span th:text="#{nav.trending}">热门</span></a>
          </li>
          <!-- 发布文章导航链接 -->
          <li class="nav-item">
            <a class="nav-link" th:classappend="${#strings.startsWith(currentUri, '/post/create') ? 'active' : ''}" th:href="@{/post/create}"><i class="bi bi-plus-circle"></i> <span th:text="#{nav.createPost}">发布文章</span></a>
          </li>
          <!-- 语言切换下拉菜单 -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-globe"></i> <span th:text="#{lang.english}">English</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" th:href="@{?(lang=zh_CN)}"><span th:text="#{lang.chinese}">中文</span></a></li>
              <li><a class="dropdown-item" th:href="@{?(lang=en)}"><span th:text="#{lang.english}">English</span></a></li>
            </ul>
          </li>
          <!-- 未登录状态：显示登录链接 -->
          <!-- th:if：session.userId为空时显示 -->
          <li class="nav-item" th:if="${session.userId == null}">
            <a class="nav-link" th:href="@{/login}"><i class="bi bi-person"></i> <span th:text="#{nav.login}">登录</span></a>
          </li>
          <!-- 已登录状态：显示用户下拉菜单 -->
          <!-- th:if：session.userId不为空时显示 -->
          <li class="nav-item dropdown" th:if="${session.userId != null}">
            <!-- 用户头像和用户名 -->
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              <!-- #strings.substring：截取用户名首字母作为头像显示 -->
              <span class="avatar-circle" th:text="${#strings.substring(session.username, 0, 1)}"
                    th:if="${session.username != null}">U</span>
              <!-- 大屏幕显示完整用户名 -->
              <span class="d-none d-lg-inline ms-2" th:text="${session.username}">Username</span>
            </a>
            <!-- 用户下拉菜单内容 -->
            <ul class="dropdown-menu dropdown-menu-end">
              <!-- 用户名标题 -->
              <li><h6 class="dropdown-header" th:text="${session.username}">Username</h6></li>
              <li><hr class="dropdown-divider"></li>
              <!-- 设置链接 -->
              <li><a class="dropdown-item" th:href="@{/user/settings}"><i class="bi bi-gear"></i> <span th:text="#{nav.settings}">设置</span></a></li>
              <!-- 个人主页链接 -->
              <li><a class="dropdown-item" th:href="@{/user/} + ${session.userId}"><i class="bi bi-person-circle"></i> <span th:text="#{nav.profile}">个人主页</span></a></li>
              <!-- 管理面板链接：仅管理员可见 -->
              <li th:if="${session.isAdmin}"><a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-shield-shaded"></i> <span th:text="#{nav.adminPanel}">管理面板</span></a></li>
              <li><hr class="dropdown-divider"></li>
              <!-- 退出登录链接 -->
              <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">退出登录</span></a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</th:block>

  <footer class="footer-custom">
    <div class="container">
      <span th:text="#{footer.copyright}">© 2026 InsightForge. All rights reserved.</span>
    </div>
  </footer>
</th:block>
