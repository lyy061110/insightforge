<!--
  ============================================================
  页面名称：创建文章页面 (create-post.html)
  页面功能：用户发布新文章的入口页面
  主要内容：
    - 文章标题输入：设置文章标题
    - 分类选择：选择文章所属分类
    - 图片上传：支持拖拽上传和点击上传，自动插入Markdown图片链接
    - 文章内容编辑：支持Markdown格式的文章内容输入
    - 发布提交：提交文章等待审核
  使用技术：Thymeleaf模板引擎 + Bootstrap 5框架 + JavaScript图片上传功能
  ============================================================
-->
<!DOCTYPE html>
<!-- HTML文档声明，引入Thymeleaf命名空间 -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- 字符编码设置 -->
  <meta charset="UTF-8">
  <!-- 视口设置，确保移动端响应式布局 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 页面标题 -->
  <title th:text="#{createPost.title}">创建文章 - InsightForge</title>
  <!-- 引入Bootstrap 5 CSS框架 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入Bootstrap Icons图标库 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- ==================== CSS样式定义 ==================== -->
  <style>
    /* ---------- CSS变量定义：全局颜色主题 ---------- */
    :root {
      --primary-dark: #1a2a4a;    /* 主色调深色 */
      --primary: #1e3a6e;         /* 主色调 */
      --primary-light: #2c5aa0;   /* 主色调浅色 */
      --accent: #4a8fe7;          /* 强调色 */
      --bg-light: #f5f7fa;        /* 浅色背景 */
      --white: #ffffff;           /* 白色 */
      --text-dark: #1a1a2e;       /* 深色文字 */
      --text-muted: #6c757d;      /* 灰色文字 */
      --border: #dee2e6;          /* 边框颜色 */
    }

    /* ---------- 页面主体样式 ---------- */
    body {
      background-color: var(--bg-light);  /* 浅色背景 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-dark);            /* 深色文字 */
      min-height: 100vh;                  /* 最小高度为视口高度 */
      display: flex;                      /* 弹性布局 */
      flex-direction: column;             /* 垂直方向排列 */
    }

    /* ---------- 导航栏样式 ---------- */
    .navbar-custom {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));  /* 渐变背景 */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);                                 /* 阴影效果 */
    }

    /* 导航栏品牌标识样式 */
    .navbar-custom .navbar-brand {
      font-weight: 700;          /* 加粗字体 */
      font-size: 1.5rem;         /* 字体大小 */
      color: var(--white) !important;  /* 白色文字 */
      letter-spacing: 0.5px;     /* 字间距 */
    }

    /* 导航栏品牌图标样式 */
    .navbar-custom .navbar-brand i {
      color: var(--accent);      /* 强调色 */
      margin-right: 6px;         /* 右侧间距 */
    }

    /* 导航栏链接样式 */
    .navbar-custom .nav-link {
      color: rgba(255, 255, 255, 0.85) !important;  /* 半透明白色 */
      font-weight: 500;                             /* 中等字重 */
      transition: color 0.2s;                       /* 颜色过渡动画 */
      padding: 0.5rem 1rem;                         /* 内边距 */
    }

    /* 导航栏链接悬停样式 */
    .navbar-custom .nav-link:hover {
      color: var(--white) !important;  /* 悬停时变为纯白色 */
    }

    /* 导航栏链接图标样式 */
    .navbar-custom .nav-link i {
      margin-right: 4px;  /* 图标右侧间距 */
    }

    /* 导航栏折叠按钮样式 */
    .navbar-custom .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.5);  /* 半透明白色边框 */
    }

    /* 导航栏折叠按钮图标样式 */
    .navbar-custom .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255,255,255,0.8)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ---------- 主内容区域样式 ---------- */
    .main-content {
      flex: 1;                    /* 占据剩余空间 */
      padding-top: 1.5rem;        /* 顶部内边距 */
      padding-bottom: 3rem;       /* 底部内边距 */
    }

    /* ---------- 页脚样式 ---------- */
    .footer-custom {
      background: var(--primary-dark);           /* 深色背景 */
      color: rgba(255, 255, 255, 0.7);           /* 半透明白色文字 */
      padding: 1rem 0;                           /* 内边距 */
      text-align: center;                        /* 居中对齐 */
      font-size: 0.875rem;                       /* 字体大小 */
      margin-top: auto;                          /* 自动顶部外边距 */
    }

    /* ---------- 创建文章卡片样式 ---------- */
    .create-card {
      background: var(--white);                   /* 白色背景 */
      border: 1px solid var(--border);            /* 边框 */
      border-radius: 12px;                        /* 圆角 */
      padding: 2rem;                              /* 内边距 */
      max-width: 800px;                           /* 最大宽度 */
      margin: 0 auto;                             /* 居中 */
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06); /* 阴影效果 */
    }

    /* 创建卡片标题样式 */
    .create-card .card-title {
      font-weight: 700;                   /* 加粗 */
      color: var(--primary-dark);         /* 深主色调 */
      margin-bottom: 1.5rem;              /* 底部外边距 */
      text-align: center;                 /* 居中对齐 */
    }

    /* ---------- 自定义按钮样式 ---------- */
    /* 主色调按钮 */
    .btn-primary-custom {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
      font-weight: 600;
      padding: 0.5rem 2rem;
    }

    .btn-primary-custom:hover {
      background: var(--primary-light);
      border-color: var(--primary-light);
      color: var(--white);
    }

    /* 上传按钮样式 */
    .btn-upload {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--white);
    }

    .btn-upload:hover {
      background: #3d7dd6;
      border-color: #3d7dd6;
      color: var(--white);
    }

    /* ---------- 表单控件聚焦样式 ---------- */
    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(74, 143, 231, 0.25);
    }

    /* ---------- 全局链接样式 ---------- */
    a {
      color: var(--primary);
    }

    a:hover {
      color: var(--primary-light);
    }

    /* ---------- 图片上传区域样式 ---------- */
    .upload-area {
      border: 2px dashed var(--border);               /* 虚线边框 */
      border-radius: 8px;                             /* 圆角 */
      padding: 2rem;                                  /* 内边距 */
      text-align: center;                             /* 居中对齐 */
      cursor: pointer;                                /* 鼠标指针 */
      transition: border-color 0.2s, background-color 0.2s;  /* 过渡动画 */
    }

    /* 上传区域悬停样式 */
    .upload-area:hover {
      border-color: var(--accent);                    /* 悬停时强调色边框 */
      background-color: rgba(74, 143, 231, 0.05);     /* 悬停时浅色背景 */
    }

    /* 上传区域拖拽悬停样式 */
    .upload-area.dragover {
      border-color: var(--accent);
      background-color: rgba(74, 143, 231, 0.1);
    }

    /* 上传区域图标样式 */
    .upload-area i {
      font-size: 2.5rem;          /* 大图标 */
      color: var(--text-muted);   /* 灰色 */
      margin-bottom: 0.5rem;      /* 底部外边距 */
    }

    /* 上传区域文字样式 */
    .upload-area p {
      color: var(--text-muted);   /* 灰色文字 */
      margin: 0;                  /* 无外边距 */
    }

    /* ---------- 图片预览区域样式 ---------- */
    .preview-images {
      display: flex;              /* 弹性布局 */
      flex-wrap: wrap;            /* 换行 */
      gap: 1rem;                  /* 间距 */
      margin-top: 1rem;           /* 顶部外边距 */
    }

    /* 单个预览图片样式 */
    .preview-image {
      position: relative;         /* 相对定位 */
      width: 120px;               /* 宽度 */
      height: 120px;              /* 高度 */
      border-radius: 8px;         /* 圆角 */
      overflow: hidden;           /* 隐藏溢出 */
      border: 1px solid var(--border);  /* 边框 */
    }

    /* 预览图片样式 */
    .preview-image img {
      width: 100%;                /* 宽度100% */
      height: 100%;               /* 高度100% */
      object-fit: cover;          /* 图片覆盖 */
    }

    /* 预览图片删除按钮样式 */
    .preview-image .remove-btn {
      position: absolute;         /* 绝对定位 */
      top: 4px;                   /* 顶部位置 */
      right: 4px;                 /* 右侧位置 */
      background: rgba(0, 0, 0, 0.6);  /* 半透明黑色背景 */
      color: white;               /* 白色文字 */
      border: none;               /* 无边框 */
      border-radius: 50%;         /* 圆形 */
      width: 24px;                /* 宽度 */
      height: 24px;               /* 高度 */
      display: flex;              /* 弹性布局 */
      align-items: center;        /* 垂直居中 */
      justify-content: center;    /* 水平居中 */
      cursor: pointer;            /* 鼠标指针 */
      font-size: 0.8rem;          /* 字体大小 */
    }

    /* 删除按钮悬停样式 */
    .preview-image .remove-btn:hover {
      background: rgba(0, 0, 0, 0.8);  /* 悬停时更深的背景 */
    }

    /* ---------- 上传进度条样式 ---------- */
    .upload-progress {
      margin-top: 0.5rem;         /* 顶部外边距 */
      display: none;              /* 默认隐藏 */
    }

    /* ---------- 上传错误提示样式 ---------- */
    .upload-error {
      color: #dc3545;             /* 红色 */
      font-size: 0.875rem;        /* 字体大小 */
      margin-top: 0.5rem;         /* 顶部外边距 */
    }

    /* ---------- 上传成功提示样式 ---------- */
    .upload-success {
      color: #28a745;             /* 绿色 */
      font-size: 0.875rem;        /* 字体大小 */
      margin-top: 0.5rem;         /* 顶部外边距 */
    }
  </style>
</head>
<body>

<!-- ==================== 引入导航栏片段 ==================== -->
<!-- th:replace：替换为layout模板中的navbar片段 -->
<th:block th:replace="~{layout :: navbar}"></th:block>

<!-- ==================== 主内容区域 ==================== -->
<div class="main-content">
  <div class="container">
    <!-- ---------- 创建文章卡片 ---------- -->
    <div class="create-card">
      <h3 class="card-title">
        <i class="bi bi-pencil-square"></i> <span th:text="#{createPost.header}">创建新文章</span>
      </h3>

      <!-- ---------- 文章创建表单 ---------- -->
      <!-- th:action：表单提交地址，@{/post/create}生成创建文章处理URL -->
      <form th:action="@{/post/create}" method="post">

        <!-- 文章标题输入 -->
        <div class="mb-3">
          <label for="title" class="form-label fw-semibold">
            <i class="bi bi-type"></i> <span th:text="#{createPost.titleLabel}">文章标题</span>
          </label>
          <!-- maxlength="200"限制标题最大长度为200字符 -->
          <input type="text" class="form-control" id="title" name="title"
                 th:placeholder="#{createPost.titlePlaceholder}" required maxlength="200">
        </div>

        <!-- 文章分类选择 -->
        <div class="mb-3">
          <label for="category" class="form-label fw-semibold">
            <i class="bi bi-folder"></i> <span th:text="#{createPost.categoryLabel}">分类</span>
          </label>
          <!-- 文章分类下拉选择框 -->
          <select class="form-select" id="category" name="category" required>
            <option value="" th:text="#{createPost.categoryPlaceholder}">-- 请选择分类 --</option>
            <!-- 分类选项列表 -->
            <option value="Technology">Technology</option>
            <option value="Science">Science</option>
            <option value="Design">Design</option>
            <option value="Business">Business</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- 图片上传区域 -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            <i class="bi bi-image"></i> <span th:text="#{createPost.uploadImage}">上传图片</span>
          </label>
          <!-- 拖拽上传区域 -->
          <div class="upload-area" id="uploadArea">
            <i class="bi bi-cloud-upload"></i>
            <p th:text="#{createPost.uploadHint}">点击或拖拽图片到此处上传</p>
            <p class="text-sm text-muted mt-1" th:text="#{createPost.uploadFormat}">支持 JPG、PNG、GIF 格式，单张不超过 5MB</p>
          </div>
          <!-- 隐藏的文件输入框 -->
          <input type="file" id="fileInput" name="images" accept="image/*" multiple class="d-none">
          <!-- 上传进度条 -->
          <div class="upload-progress">
            <div class="progress">
              <div class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
          </div>
          <!-- 上传错误提示 -->
          <div class="upload-error" id="uploadError"></div>
          <!-- 上传成功提示 -->
          <div class="upload-success" id="uploadSuccess"></div>
          <!-- 图片预览区域 -->
          <div class="preview-images" id="previewImages"></div>
        </div>

        <!-- 文章内容输入 -->
        <div class="mb-3">
          <label for="content" class="form-label fw-semibold">
            <i class="bi bi-body-text"></i> <span th:text="#{createPost.contentLabel}">文章内容</span>
          </label>
          <!-- 文章内容文本框，支持Markdown格式 -->
          <textarea class="form-control" id="content" name="content" rows="12"
                    th:placeholder="#{createPost.contentPlaceholder}" required></textarea>
          <!-- 提示信息 -->
          <small class="text-muted mt-1 d-block" th:text="#{createPost.contentHint}">提示：上传图片后会自动在内容中插入图片链接</small>
        </div>

        <!-- 底部操作按钮 -->
        <div class="d-flex justify-content-between align-items-center">
          <!-- 返回首页链接 -->
          <a th:href="@{/}" class="text-decoration-none">
            <i class="bi bi-arrow-left"></i> <span th:text="#{createPost.backHome}">返回首页</span>
          </a>
          <!-- 发布文章按钮 -->
          <button type="submit" class="btn btn-primary-custom">
            <i class="bi bi-send"></i> <span th:text="#{createPost.submit}">发布文章</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ==================== 引入页脚片段 ==================== -->
<!-- th:replace：替换为layout模板中的footer片段 -->
<th:block th:replace="~{layout :: footer}"></th:block>

<!-- 引入Bootstrap 5 JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ==================== 图片上传JavaScript功能 ==================== -->
<script>
  // 获取DOM元素引用
  const uploadArea = document.getElementById('uploadArea');      // 上传区域
  const fileInput = document.getElementById('fileInput');        // 文件输入框
  const previewImages = document.getElementById('previewImages'); // 预览区域
  const contentTextarea = document.getElementById('content');    // 内容文本框
  const uploadError = document.getElementById('uploadError');    // 错误提示
  const uploadSuccess = document.getElementById('uploadSuccess'); // 成功提示

  // ---------- 点击上传区域触发文件选择 ----------
  uploadArea.addEventListener('click', () => {
    fileInput.click();
  });

  // ---------- 拖拽上传功能 ----------
  // 拖拽悬停事件：添加视觉反馈
  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();  // 阻止默认行为
    uploadArea.classList.add('dragover');  // 添加拖拽样式
  });

  // 拖拽离开事件：移除视觉反馈
  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');  // 移除拖拽样式
  });

  // 拖拽放下事件：处理文件上传
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();  // 阻止默认行为
    uploadArea.classList.remove('dragover');  // 移除拖拽样式
    const files = e.dataTransfer.files;  // 获取拖拽的文件
    handleFiles(files);  // 处理文件
  });

  // ---------- 文件选择事件 ----------
  fileInput.addEventListener('change', (e) => {
    const files = e.target.files;  // 获取选择的文件
    handleFiles(files);  // 处理文件
  });

  // ---------- 处理文件函数 ----------
  async function handleFiles(files) {
    for (const file of files) {
      // 验证文件类型：只支持图片
      if (!file.type.startsWith('image/')) {
        uploadError.textContent = '只支持图片文件';
        continue;
      }
      // 验证文件大小：不超过5MB
      if (file.size > 5 * 1024 * 1024) {
        uploadError.textContent = '图片大小不能超过5MB';
        continue;
      }
      // 上传文件
      await uploadFile(file);
    }
  }

  // ---------- 上传文件函数 ----------
  async function uploadFile(file) {
    // 清空提示信息
    uploadError.textContent = '';
    uploadSuccess.textContent = '';

    // 创建FormData对象，用于文件上传
    const formData = new FormData();
    formData.append('file', file);

    try {
      // 发送POST请求上传图片
      const response = await fetch('/upload/image', {
        method: 'POST',
        body: formData
      });

      // 解析响应结果
      const result = await response.json();

      if (result.success) {
        // 显示图片预览
        addPreview(result.url, file.name);
        // 在内容中插入Markdown图片链接
        insertImageLink(result.url);
        uploadSuccess.textContent = '图片上传成功';
      } else {
        // 显示错误信息
        uploadError.textContent = result.message;
      }
    } catch (error) {
      // 显示上传失败错误
      uploadError.textContent = '上传失败: ' + error.message;
    }
  }

  // ---------- 添加预览图片函数 ----------
  function addPreview(url, fileName) {
    // 创建预览图片容器
    const previewDiv = document.createElement('div');
    previewDiv.className = 'preview-image';
    // 设置预览图片HTML内容
    previewDiv.innerHTML = `
      <img src="${url}" alt="${fileName}">
      <button class="remove-btn" onclick="removePreview(this)">×</button>
    `;
    // 添加到预览区域
    previewImages.appendChild(previewDiv);
  }

  // ---------- 移除预览图片函数 ----------
  function removePreview(btn) {
    btn.parentElement.remove();  // 移除预览图片元素
  }

  // ---------- 在内容中插入图片链接函数 ----------
  function insertImageLink(url) {
    const textarea = contentTextarea;
    const cursorPos = textarea.selectionStart;  // 获取光标位置
    const textBefore = textarea.value.substring(0, cursorPos);  // 光标前的文本
    const textAfter = textarea.value.substring(cursorPos);      // 光标后的文本
    // 在光标位置插入Markdown图片链接
    textarea.value = textBefore + `\n![图片](${url})\n` + textAfter;
    // 将光标移动到插入位置之后
    textarea.focus();
    textarea.setSelectionRange(cursorPos + `\n![图片](${url})\n`.length, cursorPos + `\n![图片](${url})\n`.length);
  }
</script>
</body>
</html>
