<!--
  ============================================================
  页面名称：用户个人主页 (user-profile.html)
  页面功能：展示用户个人信息和活动记录
  主要内容：
    - 用户信息头部：显示用户头像、用户名、信誉分、注册时间
    - 我的文章标签页：展示用户发布的所有文章
    - 我的收藏标签页：展示用户收藏的文章
    - 浏览历史标签页：展示用户浏览过的文章历史
  使用技术：Thymeleaf模板引擎 + Bootstrap 5框架
  ============================================================
-->
<!DOCTYPE html>
<!-- HTML文档声明，设置语言为中文，引入Thymeleaf命名空间 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- 字符编码设置 -->
  <meta charset="UTF-8">
  <!-- 视口设置，确保移动端响应式布局 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- th:text：动态设置页面标题，显示用户名 -->
  <title th:text="${profileUser?.username} + ' - InsightForge'">用户主页 - InsightForge</title>
  <!-- 引入Bootstrap 5 CSS框架 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入Bootstrap Icons图标库 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- ==================== CSS样式定义 ==================== -->
  <style>
    /* ---------- CSS变量定义：全局颜色主题 ---------- */
    :root {
      --primary-dark: #1a2a4a;    /* 主色调深色 */
      --primary: #1e3a6e;         /* 主色调 */
      --primary-light: #2c5aa0;   /* 主色调浅色 */
      --accent: #4a8fe7;          /* 强调色 */
      --bg-light: #f5f7fa;        /* 浅色背景 */
      --white: #ffffff;           /* 白色 */
      --text-dark: #1a1a2e;       /* 深色文字 */
      --text-muted: #6c757d;      /* 灰色文字 */
      --border: #dee2e6;          /* 边框颜色 */
    }

    /* ---------- 页面主体样式 ---------- */
    body {
      background-color: var(--bg-light);  /* 浅色背景 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-dark);            /* 深色文字 */
      min-height: 100vh;                  /* 最小高度为视口高度 */
      display: flex;                      /* 弹性布局 */
      flex-direction: column;             /* 垂直方向排列 */
    }

    /* ---------- 导航栏样式 ---------- */
    .navbar-custom {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));  /* 渐变背景 */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);                                 /* 阴影效果 */
    }

    /* 导航栏品牌标识样式 */
    .navbar-custom .navbar-brand {
      font-weight: 700;          /* 加粗字体 */
      font-size: 1.5rem;         /* 字体大小 */
      color: var(--white) !important;  /* 白色文字 */
      letter-spacing: 0.5px;     /* 字间距 */
    }

    /* 导航栏品牌图标样式 */
    .navbar-custom .navbar-brand i {
      color: var(--accent);      /* 强调色 */
      margin-right: 6px;         /* 右侧间距 */
    }

    /* 导航栏链接样式 */
    .navbar-custom .nav-link {
      color: rgba(255, 255, 255, 0.85) !important;  /* 半透明白色 */
      font-weight: 500;                             /* 中等字重 */
      transition: color 0.2s;                       /* 颜色过渡动画 */
      padding: 0.5rem 1rem;                         /* 内边距 */
    }

    /* 导航栏链接悬停样式 */
    .navbar-custom .nav-link:hover {
      color: var(--white) !important;  /* 悬停时变为纯白色 */
    }

    /* 导航栏链接图标样式 */
    .navbar-custom .nav-link i {
      margin-right: 4px;  /* 图标右侧间距 */
    }

    /* 导航栏折叠按钮样式 */
    .navbar-custom .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.5);  /* 半透明白色边框 */
    }

    /* 导航栏折叠按钮图标样式 */
    .navbar-custom .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255,255,255,0.8)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ---------- 主内容区域样式 ---------- */
    .main-content {
      flex: 1;                    /* 占据剩余空间 */
      padding-top: 1.5rem;        /* 顶部内边距 */
      padding-bottom: 3rem;       /* 底部内边距 */
    }

    /* ---------- 页脚样式 ---------- */
    .footer-custom {
      background: var(--primary-dark);           /* 深色背景 */
      color: rgba(255, 255, 255, 0.7);           /* 半透明白色文字 */
      padding: 1rem 0;                           /* 内边距 */
      text-align: center;                        /* 居中对齐 */
      font-size: 0.875rem;                       /* 字体大小 */
      margin-top: auto;                          /* 自动顶部外边距 */
    }

    /* ---------- 用户信息头部样式 ---------- */
    .profile-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));  /* 渐变背景 */
      border-radius: 12px;                       /* 圆角 */
      padding: 2rem;                             /* 内边距 */
      color: var(--white);                       /* 白色文字 */
      margin-bottom: 1.5rem;                     /* 底部外边距 */
    }

    /* 用户头像样式 */
    .profile-avatar {
      width: 72px;                               /* 宽度 */
      height: 72px;                              /* 高度 */
      background: rgba(255, 255, 255, 0.2);      /* 半透明白色背景 */
      border-radius: 50%;                        /* 圆形 */
      display: flex;                             /* 弹性布局 */
      align-items: center;                       /* 垂直居中 */
      justify-content: center;                   /* 水平居中 */
      font-size: 2rem;                           /* 字体大小 */
      margin-right: 1.25rem;                     /* 右侧外边距 */
      flex-shrink: 0;                            /* 不收缩 */
    }

    /* 用户信息标题样式 */
    .profile-info h4 {
      font-weight: 700;                          /* 加粗 */
      margin-bottom: 0.25rem;                    /* 底部外边距 */
    }

    /* 用户统计信息样式 */
    .profile-stats {
      display: flex;                             /* 弹性布局 */
      gap: 1.5rem;                               /* 间距 */
      margin-top: 0.5rem;                        /* 顶部外边距 */
    }

    /* 统计徽章样式 */
    .profile-stats .stat-badge {
      background: rgba(255, 255, 255, 0.15);     /* 半透明白色背景 */
      padding: 4px 14px;                         /* 内边距 */
      border-radius: 20px;                       /* 圆角 */
      font-size: 0.85rem;                        /* 字体大小 */
    }

    /* 统计徽章图标样式 */
    .profile-stats .stat-badge i {
      margin-right: 4px;                         /* 图标右侧间距 */
    }

    /* ---------- 信誉分徽章样式 ---------- */
    .reputation-score {
      background: linear-gradient(135deg, #f1c40f, #e67e22);  /* 金色渐变背景 */
      color: var(--white);                       /* 白色文字 */
      font-weight: 700;                          /* 加粗 */
      font-size: 0.9rem;                         /* 字体大小 */
      padding: 4px 16px;                         /* 内边距 */
      border-radius: 20px;                       /* 圆角 */
      display: inline-block;                     /* 行内块显示 */
    }

    .reputation-score i {
      margin-right: 4px;                         /* 图标右侧间距 */
    }

    /* ---------- 标签页导航样式 ---------- */
    .nav-tabs .nav-link {
      color: var(--text-dark);                   /* 深色文字 */
      font-weight: 500;                          /* 中等字重 */
      border: none;                              /* 无边框 */
      padding: 0.75rem 1.25rem;                  /* 内边距 */
    }

    /* 标签页激活状态样式 */
    .nav-tabs .nav-link.active {
      color: var(--primary);                     /* 主色调 */
      font-weight: 600;                          /* 半粗体 */
      border-bottom: 3px solid var(--accent);    /* 底部强调色边框 */
      background: transparent;                   /* 透明背景 */
    }

    /* 标签页悬停样式 */
    .nav-tabs .nav-link:hover:not(.active) {
      border-bottom: 3px solid transparent;      /* 透明边框 */
      color: var(--primary-light);               /* 浅主色调 */
    }

    /* ---------- 标签页内容包装器样式 ---------- */
    .tab-content-wrapper {
      background: var(--white);                  /* 白色背景 */
      border: 1px solid var(--border);           /* 边框 */
      border-radius: 0 0 8px 8px;                /* 底部圆角 */
      padding: 1.25rem;                          /* 内边距 */
    }

    /* ---------- 文章卡片样式 ---------- */
    .post-card {
      background: var(--white);                  /* 白色背景 */
      border: 1px solid var(--border);           /* 边框 */
      border-radius: 8px;                        /* 圆角 */
      padding: 1rem;                             /* 内边距 */
      margin-bottom: 0.75rem;                    /* 底部外边距 */
      transition: box-shadow 0.2s;               /* 阴影过渡 */
    }

    /* 文章卡片悬停效果 */
    .post-card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); /* 悬停阴影 */
    }

    /* 文章卡片标题样式 */
    .post-card .post-title {
      font-size: 1.05rem;                        /* 字体大小 */
      font-weight: 600;                          /* 半粗体 */
      color: var(--primary);                     /* 主色调 */
      text-decoration: none;                     /* 无下划线 */
    }

    /* 文章卡片标题悬停样式 */
    .post-card .post-title:hover {
      color: var(--primary-light);               /* 浅主色调 */
    }

    /* 文章卡片元信息样式 */
    .post-card .post-meta {
      font-size: 0.8rem;                         /* 字体大小 */
      color: var(--text-muted);                  /* 灰色文字 */
    }

    /* ---------- 分类徽章样式 ---------- */
    .category-badge {
      background: var(--primary-light);          /* 浅主色调背景 */
      color: var(--white);                       /* 白色文字 */
      font-size: 0.7rem;                         /* 字体大小 */
      font-weight: 500;                          /* 中等字重 */
      padding: 2px 8px;                          /* 内边距 */
      border-radius: 10px;                       /* 圆角 */
      text-decoration: none;                     /* 无下划线 */
    }

    /* 分类徽章悬停样式 */
    .category-badge:hover {
      background: var(--accent);                 /* 强调色背景 */
      color: var(--white);                       /* 白色文字 */
    }

    /* ---------- 空状态提示样式 ---------- */
    .empty-state {
      text-align: center;                        /* 居中对齐 */
      padding: 2rem 0;                           /* 内边距 */
      color: var(--text-muted);                  /* 灰色文字 */
    }

    .empty-state i {
      font-size: 2.5rem;                         /* 大图标 */
      margin-bottom: 0.75rem;                    /* 底部外边距 */
    }

    /* ---------- 全局链接样式 ---------- */
    a {
      color: var(--primary);
    }

    a:hover {
      color: var(--primary-light);
    }
  </style>
</head>
<body>

<!-- ==================== 引入导航栏片段 ==================== -->
<!-- th:replace：替换为layout模板中的navbar片段 -->
<th:block th:replace="~{layout :: navbar}"></th:block>

<!-- ==================== 主内容区域 ==================== -->
<div class="main-content">
  <div class="container">
    <!-- ---------- 用户不存在提示 ---------- -->
    <!-- th:if：当profileUser为空时显示用户不存在提示 -->
    <th:block th:if="${profileUser == null}">
      <div class="empty-state">
        <i class="bi bi-person-x d-block"></i>
        <p class="fs-5">用户不存在</p>
        <!-- 返回首页按钮 -->
        <a th:href="@{/}" class="btn btn-primary-custom mt-2">
          <i class="bi bi-arrow-left"></i> 返回首页
        </a>
      </div>
    </th:block>

    <!-- ---------- 用户信息展示 ---------- -->
    <!-- th:if：当profileUser不为空时显示用户信息 -->
    <th:block th:if="${profileUser != null}">
      <!-- 用户信息头部区域 -->
      <div class="profile-header">
        <div class="d-flex align-items-center">
          <!-- 用户头像图标 -->
          <div class="profile-avatar">
            <i class="bi bi-person-fill"></i>
          </div>
          <!-- 用户信息详情 -->
          <div class="profile-info">
            <!-- th:text：显示用户名 -->
            <h4 th:text="${profileUser.username}">用户名</h4>
            <!-- 用户统计信息 -->
            <div class="profile-stats">
              <!-- 信誉分徽章 -->
              <span class="reputation-score">
                <i class="bi bi-star-fill"></i>
                <span th:text="#{userProfile.reputation}">信誉分：</span><span th:text="${profileUser.reputation}">0</span>
              </span>
              <!-- 注册时间徽章 -->
              <span class="stat-badge">
                <i class="bi bi-calendar-check"></i>
                注册于：<span th:text="${profileUser.createdAt != null ? #temporals.format(profileUser.createdAt, 'yyyy-MM-dd') : 'N/A'}">日期</span>
              </span>
              <!-- 文章数量徽章 -->
              <span class="stat-badge">
                <i class="bi bi-file-text"></i>
                <!-- #lists.size：获取列表大小 -->
                <span th:text="${posts != null ? #lists.size(posts) : 0}">0</span> 篇文章
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- ---------- 标签页导航 ---------- -->
      <ul class="nav nav-tabs" id="profileTabs" role="tablist">
        <!-- 我的文章标签 -->
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="posts-tab" data-bs-toggle="tab" data-bs-target="#posts-pane" type="button" role="tab">
            <i class="bi bi-file-text"></i> 我的文章
            <!-- 文章数量徽章 -->
            <span class="badge bg-primary ms-1" th:text="${posts != null ? #lists.size(posts) : 0}">0</span>
          </button>
        </li>
        <!-- 我的收藏标签 -->
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="saved-tab" data-bs-toggle="tab" data-bs-target="#saved-pane" type="button" role="tab">
            <i class="bi bi-bookmark"></i> 我的收藏
            <!-- 收藏数量徽章 -->
            <span class="badge bg-primary ms-1" th:text="${savedPosts != null ? #lists.size(savedPosts) : 0}">0</span>
          </button>
        </li>
        <!-- 浏览历史标签 -->
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history-pane" type="button" role="tab">
            <i class="bi bi-clock-history"></i> <span th:text="#{userProfile.browseHistory}">浏览历史</span>
            <!-- 浏览历史数量徽章 -->
            <span class="badge bg-primary ms-1" th:text="${browseHistory != null ? #lists.size(browseHistory) : 0}">0</span>
          </button>
        </li>
      </ul>

      <!-- ---------- 标签页内容区域 ---------- -->
      <div class="tab-content tab-content-wrapper" id="profileTabContent">
        <!-- 我的文章标签页内容 -->
        <div class="tab-pane fade show active" id="posts-pane" role="tabpanel">
          <!-- th:if：当文章列表不为空时显示 -->
          <th:block th:if="${posts != null and !posts.isEmpty()}">
            <!-- th:each：遍历文章列表 -->
            <div class="post-card" th:each="post : ${posts}">
              <div class="d-flex justify-content-between align-items-start mb-1">
                <!-- 文章标题链接 -->
                <a class="post-title" th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}">文章标题</a>
                <!-- 分类徽章 -->
                <a th:href="@{/category/{name}(name=${post.category})}" class="category-badge" th:text="${post.category}" th:if="${post.category != null}">分类</a>
              </div>
              <!-- 文章元信息 -->
              <div class="post-meta d-flex flex-wrap align-items-center gap-2">
                <span><i class="bi bi-hand-thumbs-up"></i> <span th:text="${post.likeCount}">0</span></span>
                <span><i class="bi bi-chat-dots"></i> <span th:text="${post.commentCount}">0</span></span>
                <span class="text-muted">|</span>
                <span><i class="bi bi-clock"></i> <span th:if="${post.createdAt != null}" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">时间</span></span>
              </div>
            </div>
          </th:block>
          <!-- 文章列表为空时的提示 -->
          <th:block th:if="${posts == null or posts.isEmpty()}">
            <div class="empty-state">
              <i class="bi bi-journal-text d-block"></i>
              <p th:text="#{userProfile.noPosts}">暂无文章</p>
            </div>
          </th:block>
        </div>

        <!-- 我的收藏标签页内容 -->
        <div class="tab-pane fade" id="saved-pane" role="tabpanel">
          <!-- th:if：当收藏列表不为空时显示 -->
          <th:block th:if="${savedPosts != null and !savedPosts.isEmpty()}">
            <!-- th:each：遍历收藏文章列表 -->
            <div class="post-card" th:each="post : ${savedPosts}">
              <div class="d-flex justify-content-between align-items-start mb-1">
                <!-- 文章标题链接 -->
                <a class="post-title" th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}">文章标题</a>
                <!-- 分类徽章 -->
                <a th:href="@{/category/{name}(name=${post.category})}" class="category-badge" th:text="${post.category}" th:if="${post.category != null}">分类</a>
              </div>
              <!-- 文章元信息 -->
              <div class="post-meta d-flex flex-wrap align-items-center gap-2">
                <span><i class="bi bi-person-circle"></i> <span th:text="${post.authorName} ?: 'Anonymous'">作者</span></span>
                <span class="text-muted">|</span>
                <span><i class="bi bi-hand-thumbs-up"></i> <span th:text="${post.likeCount}">0</span></span>
                <span><i class="bi bi-chat-dots"></i> <span th:text="${post.commentCount}">0</span></span>
              </div>
            </div>
          </th:block>
          <!-- 收藏列表为空时的提示 -->
          <th:block th:if="${savedPosts == null or savedPosts.isEmpty()}">
            <div class="empty-state">
              <i class="bi bi-bookmark-plus d-block"></i>
              <p>暂无收藏文章</p>
            </div>
          </th:block>
        </div>

        <!-- 浏览历史标签页内容 -->
        <div class="tab-pane fade" id="history-pane" role="tabpanel">
          <!-- th:if：当浏览历史不为空时显示 -->
          <th:block th:if="${browseHistory != null and !browseHistory.isEmpty()}">
            <!-- th:each：遍历浏览历史列表 -->
            <div class="post-card" th:each="post : ${browseHistory}">
              <div class="d-flex justify-content-between align-items-start mb-1">
                <!-- 文章标题链接 -->
                <a class="post-title" th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}">文章标题</a>
                <!-- 分类徽章 -->
                <a th:href="@{/category/{name}(name=${post.category})}" class="category-badge" th:text="${post.category}" th:if="${post.category != null}">分类</a>
              </div>
              <!-- 文章元信息 -->
              <div class="post-meta d-flex flex-wrap align-items-center gap-2">
                <span><i class="bi bi-person-circle"></i> <span th:text="${post.authorName} ?: 'Anonymous'">作者</span></span>
                <span class="text-muted">|</span>
                <span><i class="bi bi-hand-thumbs-up"></i> <span th:text="${post.likeCount}">0</span></span>
                <span><i class="bi bi-chat-dots"></i> <span th:text="${post.commentCount}">0</span></span>
              </div>
            </div>
          </th:block>
          <!-- 浏览历史为空时的提示 -->
          <th:block th:if="${browseHistory == null or browseHistory.isEmpty()}">
            <div class="empty-state">
              <i class="bi bi-eyeglasses d-block"></i>
              <p>暂无浏览历史</p>
            </div>
          </th:block>
        </div>
      </div>
    </th:block>
  </div>
</div>

<!-- ==================== 引入页脚片段 ==================== -->
<!-- th:replace：替换为layout模板中的footer片段 -->
<th:block th:replace="~{layout :: footer}"></th:block>

<!-- 引入Bootstrap 5 JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
